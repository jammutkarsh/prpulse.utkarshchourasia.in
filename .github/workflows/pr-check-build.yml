name: Lint, Check, and Build

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    check-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run lint(Extension)
              run: bun run lint

            - name: Run lint(Website)
              run: bun run --filter pr-pulse-website lint

            - name: Run checks(Extension)
              run: bun run check

            - name: Run checks(Website)
              run: bun run --filter pr-pulse-website check

            - name: Build project(Extension)
              run: bun run build

            - name: Build project(Website)
              run: bun run --filter pr-pulse-website build
